name: Generate F1 Dashboard

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: profile-updates
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate and push dashboard
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3; do
            echo "========================================"
            echo "Attempt $attempt of 3"
            echo "========================================"

            if ! git fetch origin main; then
              echo "Failed to fetch origin/main."
              exit 1
            fi

            if ! git reset --hard origin/main; then
              echo "Failed to reset to origin/main."
              exit 1
            fi

            echo "Generating F1 dashboard..."

            if ! python scripts/dashboard.py; then
              echo "Dashboard generation failed."
              exit 1
            fi

            git add assets/f1-dashboard.svg

            if git diff --staged --quiet; then
              echo "No dashboard changes."
              exit 0
            fi

            git commit -m "Update F1 Dashboard"

            if git push origin HEAD:main; then
              echo "Dashboard successfully pushed."
              exit 0
            fi

            echo "Push failed."

            if [ "$attempt" -lt 3 ]; then
              WAIT=$((5 * attempt))
              echo "Retrying in ${WAIT} seconds..."
              sleep "$WAIT"
            fi
          done

          echo "Failed to push dashboard after 3 attempts."
          exit 1